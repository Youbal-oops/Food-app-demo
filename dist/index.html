<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Delivr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0C0C0C; --bg2: #181818; --bg3: #222; --bg4: #2A2A2A;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
      --text: #EEEBE5; --muted: #777; --muted2: #555;
      --accent: #E04B30; --accent-dim: rgba(224,75,48,0.15);
      --green: #22C55E; --green-dim: rgba(34,197,94,0.12);
      --blue: #3B82F6; --amber: #F59E0B;
      --font-h: 'Syne', sans-serif; --font-b: 'DM Sans', sans-serif;
      --r: 16px; --r-sm: 10px; --nav: 60px; --tab: 62px;
    }
    html, body { height: 100%; background: #000; color: var(--text); font-family: var(--font-b); overflow: hidden; }

    /* Shell */
    #shell { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; background: var(--bg); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; overflow: hidden; }

    /* Screens */
    .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .screen.active { display: flex; }

    /* Scroll area */
    .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .scroller::-webkit-scrollbar { display: none; }

    /* Top bar */
    .topbar { height: var(--nav); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 5; }
    .topbar-logo { font-family: var(--font-h); font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
    .topbar-logo em { color: var(--accent); font-style: normal; }
    .topbar-right { display: flex; gap: 10px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; position: relative; transition: background .15s; }
    .icon-btn:hover { background: var(--bg3); }
    .badge { position: absolute; top: -3px; right: -3px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-h); }

    /* Tab bar */
    .tabbar { height: var(--tab); display: flex; background: var(--bg); border-top: 1px solid var(--border); flex-shrink: 0; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--muted); font-size: 9px; font-family: var(--font-h); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: none; background: none; transition: color .15s; }
    .tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { color: var(--accent); }

    /* Shared */
    .pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 9px; font-weight: 700; font-family: var(--font-h); letter-spacing: .07em; text-transform: uppercase; }
    .p-accent { background: var(--accent); color: #fff; }
    .p-green { background: var(--green-dim); color: var(--green); }
    .p-muted { background: var(--bg3); color: var(--muted); }
    .p-blue { background: rgba(59,130,246,.15); color: var(--blue); }
    .p-amber { background: rgba(245,158,11,.15); color: var(--amber); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 12px; cursor: pointer; font-family: var(--font-h); font-weight: 700; font-size: 14px; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.97); }
    .btn:hover { opacity: .88; }
    .btn-primary { background: var(--accent); color: #fff; padding: 15px 24px; width: 100%; }
    .btn-ghost { background: var(--bg3); color: var(--text); padding: 13px 20px; }
    .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 13px 20px; }
    input, textarea, select { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; color: var(--text); font-family: var(--font-b); font-size: 14px; padding: 14px 16px; width: 100%; outline: none; transition: border-color .15s; }
    input:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--muted2); }
    label { font-size: 11px; color: var(--muted); font-family: var(--font-h); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    .divider { height: 1px; background: var(--border); margin: 18px 0; }
    .section-title { font-family: var(--font-h); font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
    .h-row { display: flex; align-items: center; justify-content: space-between; }
    .see-all { font-size: 12px; color: var(--accent); font-family: var(--font-h); font-weight: 700; cursor: pointer; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .1s; }
    .qty-btn:hover { background: var(--accent); border-color: var(--accent); }
    .qty-n { font-family: var(--font-h); font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }
    .add-btn { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }
    @keyframes slideUp { from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1} }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }

    /* Toast */
    .toast { position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 99px; font-family: var(--font-h); font-size: 12px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 999; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Sheet overlay */
    .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.65); z-index: 50; display: none; animation: fadeIn .2s; }
    .sheet-overlay.open { display: block; }
    .sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg2); border-radius: 24px 24px 0 0; border-top: 1px solid var(--border2); max-height: 90%; display: flex; flex-direction: column; animation: slideUp .3s cubic-bezier(.32,.72,0,1); }
    .sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
    .sheet-scroll { overflow-y: auto; padding: 0 20px 32px; }
    .sheet-scroll::-webkit-scrollbar { display: none; }

    /* ── LOGIN SCREEN ─────────────────────────────── */
    #screen-login { justify-content: flex-end; background: var(--bg); }
    .login-bg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px 20px 20px; }
    .login-logo { font-family: var(--font-h); font-size: 48px; font-weight: 800; letter-spacing: -2px; }
    .login-logo em { color: var(--accent); font-style: normal; }
    .login-tagline { font-size: 14px; color: var(--muted); }
    .login-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 28px 28px 0 0; padding: 28px 24px 40px; }
    .role-picker { display: flex; gap: 10px; margin-bottom: 24px; }
    .role-btn { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--border2); background: var(--bg3); cursor: pointer; text-align: center; transition: all .2s; }
    .role-btn.active { border-color: var(--accent); background: var(--accent-dim); }
    .role-btn .rb-icon { font-size: 26px; display: block; margin-bottom: 6px; }
    .role-btn .rb-label { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .role-btn .rb-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .role-btn.active .rb-label { color: var(--accent); }
    .login-or { text-align: center; font-size: 12px; color: var(--muted); margin: 16px 0; position: relative; }
    .login-or::before, .login-or::after { content:''; position:absolute; top:50%; width:42%; height:1px; background: var(--border); }
    .login-or::before { left:0; } .login-or::after { right:0; }
    .auth-toggle { display: flex; background: var(--bg3); border-radius: 10px; padding: 3px; margin-bottom: 20px; }
    .auth-toggle-btn { flex: 1; padding: 9px; text-align: center; border-radius: 8px; font-family: var(--font-h); font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all .15s; }
    .auth-toggle-btn.active { background: var(--accent); color: #fff; }
    .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.6; }
    .hint span { color: var(--accent); cursor: pointer; }

    /* ── HOME ─────────────────────────────────────── */
    .home-header { padding: 18px 18px 0; }
    .home-greeting { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .home-greeting strong { color: var(--text); }
    .home-title { font-family: var(--font-h); font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; }
    .home-title em { color: var(--accent); font-style: normal; }
    .promo-rail { display: flex; gap: 10px; padding: 0 18px; overflow-x: auto; }
    .promo-rail::-webkit-scrollbar { display: none; }
    .promo-card { flex-shrink: 0; width: 272px; height: 130px; border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative; overflow: hidden; }
    .promo-card::after { content:''; position:absolute; right:-24px; top:-24px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.07); }
    .promo-tag { font-family: var(--font-h); font-size: 9px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.6); }
    .promo-title { font-family: var(--font-h); font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -.3px; }
    .promo-sub { font-size: 12px; color: rgba(255,255,255,.7); }
    .cat-rail { display: flex; gap: 8px; padding: 0 18px; overflow-x: auto; }
    .cat-rail::-webkit-scrollbar { display: none; }
    .cat-chip { flex-shrink: 0; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--border2); background: var(--bg2); font-family: var(--font-h); font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all .15s; white-space: nowrap; }
    .cat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .feat-rail { display: flex; gap: 10px; padding: 0 18px; overflow-x: auto; }
    .feat-rail::-webkit-scrollbar { display: none; }
    .feat-card { flex-shrink: 0; width: 164px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; cursor: pointer; transition: transform .15s; }
    .feat-card:hover { transform: translateY(-2px); }
    .feat-img { height: 100px; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 38px; }
    .feat-body { padding: 10px; }
    .feat-name { font-family: var(--font-h); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .feat-foot { display: flex; align-items: center; justify-content: space-between; }
    .feat-price { font-size: 13px; color: var(--accent); font-weight: 500; }
    .active-bar { margin: 0 18px; background: linear-gradient(135deg,#0d1f0d,#132010); border: 1px solid rgba(34,197,94,.2); border-radius: var(--r); padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .ab-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.5s infinite; }

    /* ── MENU ─────────────────────────────────────── */
    .menu-top { padding: 16px 18px 0; }
    .search-wrap { position: relative; margin-top: 14px; }
    .search-wrap input { padding-left: 40px; }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--muted); }
    .menu-group { padding: 20px 18px 0; }
    .mg-title { font-family: var(--font-h); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .menu-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity .15s; }
    .menu-row:hover { opacity: .85; }
    .menu-row:last-child { border-bottom: none; }
    .menu-row-img { width: 68px; height: 68px; border-radius: 12px; background: var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; }
    .veg-dot { position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid; display: flex; align-items: center; justify-content: center; }
    .veg-dot.veg { border-color: var(--green); } .veg-dot.veg::after { content:''; width:5px; height:5px; border-radius:50%; background:var(--green); }
    .veg-dot.nonveg { border-color: #E04B30; } .veg-dot.nonveg::after { content:''; width:5px; height:5px; border-radius:50%; background:#E04B30; }
    .menu-row-info { flex: 1; min-width: 0; }
    .menu-row-name { font-family: var(--font-h); font-size: 14px; font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .menu-row-desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-row-price { font-size: 14px; font-weight: 500; }
    .unavail { opacity: .4; pointer-events: none; }

    /* ── CART ─────────────────────────────────────── */
    .cart-wrap { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .cart-row { display: flex; align-items: center; gap: 12px; }
    .cart-img { width: 54px; height: 54px; border-radius: 10px; background: var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .cart-info { flex: 1; }
    .cart-name { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .cart-price { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .summary-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 15px; }
    .s-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 9px; color: var(--muted); }
    .s-row.total { font-family: var(--font-h); font-weight: 700; font-size: 15px; color: var(--text); border-top: 1px solid var(--border); padding-top: 11px; margin-top: 4px; margin-bottom: 0; }
    .s-row.total span:last-child { color: var(--accent); }
    .addr-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 13px 15px; display: flex; align-items: flex-start; gap: 10px; }
    .addr-text { flex: 1; font-size: 13px; line-height: 1.5; }
    .addr-text strong { font-family: var(--font-h); font-size: 12px; display: block; margin-bottom: 2px; }
    .addr-change { font-size: 11px; color: var(--accent); font-family: var(--font-h); font-weight: 700; cursor: pointer; white-space: nowrap; }

    /* ── TRACKER ──────────────────────────────────── */
    .tracker-wrap { padding: 18px; }
    .tl-step { display: flex; gap: 14px; }
    .tl-left { display: flex; flex-direction: column; align-items: center; width: 22px; flex-shrink: 0; }
    .tl-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
    .tl-dot.done { background: var(--green); }
    .tl-dot.active { background: var(--accent); animation: pulse 1.5s infinite; }
    .tl-dot.pend { background: var(--bg3); border: 1px solid var(--border2); }
    .tl-line { width: 2px; flex: 1; min-height: 20px; background: var(--border); margin: 3px 0; }
    .tl-line.done { background: var(--green); }
    .tl-right { padding-bottom: 22px; flex: 1; }
    .tl-label { font-family: var(--font-h); font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .tl-label.pend { color: var(--muted); }
    .tl-time { font-size: 11px; color: var(--muted); }
    .driver-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; display: flex; align-items: center; gap: 12px; }
    .drv-av { width: 46px; height: 46px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .drv-call { width: 38px; height: 38px; border-radius: 50%; background: var(--green-dim); border: none; color: var(--green); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .past-order { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; }
    .po-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .po-id { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .po-total { font-size: 13px; color: var(--accent); }
    .po-sub { font-size: 11px; color: var(--muted); }

    /* ── ACCOUNT ──────────────────────────────────── */
    .acct-wrap { padding: 18px; }
    .acct-hero { background: linear-gradient(135deg, var(--bg2), var(--bg3)); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
    .acct-av { width: 58px; height: 58px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .acct-name { font-family: var(--font-h); font-size: 18px; font-weight: 800; }
    .acct-phone { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .acct-edit { font-size: 11px; color: var(--accent); font-family: var(--font-h); font-weight: 700; cursor: pointer; margin-top: 5px; }
    .acct-menu { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; }
    .acct-item { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
    .acct-item:last-child { border-bottom: none; }
    .acct-item:hover { background: var(--bg3); }
    .ai-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 17px; }
    .ai-text { flex: 1; }
    .ai-label { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .ai-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .ai-arrow { color: var(--muted); font-size: 16px; }

    /* ── ADMIN ────────────────────────────────────── */
    .admin-wrap { display: flex; flex-direction: column; }
    .admin-tabs-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
    .adm-tab { flex: 1; padding: 12px 4px; text-align: center; font-family: var(--font-h); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
    .adm-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .adm-content { padding: 18px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
    .stat-v { font-family: var(--font-h); font-size: 24px; font-weight: 800; }
    .stat-l { font-size: 10px; color: var(--muted); margin-top: 3px; font-family: var(--font-h); letter-spacing: .05em; text-transform: uppercase; }
    .adm-order { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 13px; margin-bottom: 9px; }
    .ao-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ao-id { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .ao-addr { font-size: 12px; color: var(--muted); margin-bottom: 9px; }
    .ao-foot { display: flex; justify-content: space-between; align-items: center; }
    .ao-drv { font-size: 11px; color: var(--muted); }
    .ao-total { font-family: var(--font-h); font-size: 13px; font-weight: 700; color: var(--accent); }
    .sp { padding: 3px 9px; border-radius: 99px; font-size: 9px; font-weight: 700; font-family: var(--font-h); letter-spacing: .05em; text-transform: uppercase; }
    .sp-placed { background: rgba(245,158,11,.15); color: var(--amber); }
    .sp-confirmed, .sp-preparing { background: rgba(59,130,246,.15); color: var(--blue); }
    .sp-out_for_delivery { background: var(--green-dim); color: var(--green); }
    .sp-delivered { background: var(--bg3); color: var(--muted); }
    .adm-menu-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; gap: 11px; align-items: center; }
    .ami-img { width: 52px; height: 52px; border-radius: 10px; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .ami-name { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .ami-cat { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .ami-price { font-size: 13px; color: var(--accent); margin-top: 4px; }
    .toggle { width: 42px; height: 24px; border-radius: 99px; position: relative; cursor: pointer; border: none; transition: background .2s; flex-shrink: 0; }
    .toggle.on { background: var(--green); }
    .toggle.off { background: var(--bg4); }
    .toggle::after { content:''; position:absolute; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .2s; }
    .toggle.on::after { left:21px; } .toggle.off::after { left:3px; }
    .staff-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 11px; }
    .staff-av { width: 42px; height: 42px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 18px; }

    /* ── ITEM DETAIL SHEET ────────────────────────── */
    .item-sheet-hero { background: var(--bg3); height: 200px; display: flex; align-items: center; justify-content: center; font-size: 80px; border-radius: 20px 20px 0 0; margin: 0 -20px; }
    .item-sheet-name { font-family: var(--font-h); font-size: 22px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 8px; }
    .item-sheet-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .item-sheet-desc { font-size: 14px; line-height: 1.7; color: var(--muted); margin-bottom: 18px; }
    .item-sheet-ingredients { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .ing-tag { background: var(--bg3); border: 1px solid var(--border); border-radius: 99px; padding: 4px 11px; font-size: 11px; color: var(--muted); }
    .item-sheet-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .isf-price { font-family: var(--font-h); font-size: 22px; font-weight: 800; }
    .isf-price span { font-size: 14px; font-weight: 400; color: var(--muted); }

    /* ── SECTION SHEETS (account subsections) ─────── */
    .sheet-title { font-family: var(--font-h); font-size: 18px; font-weight: 800; margin: 18px 0 14px; }
    .order-hist-card { background: var(--bg3); border-radius: 12px; padding: 13px; margin-bottom: 10px; }
    .ohc-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .ohc-id { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .ohc-total { font-size: 13px; color: var(--accent); font-family: var(--font-h); font-weight: 700; }
    .ohc-items { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .addr-saved { background: var(--bg3); border-radius: 12px; padding: 13px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start; }
    .addr-lbl { font-family: var(--font-h); font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .addr-full { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .payment-card { background: var(--bg3); border-radius: 12px; padding: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
    .pay-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .pay-label { font-family: var(--font-h); font-size: 13px; font-weight: 700; }
    .pay-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .faq-item { background: var(--bg3); border-radius: 12px; padding: 13px; margin-bottom: 8px; cursor: pointer; }
    .faq-q { font-family: var(--font-h); font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
    .faq-a { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; display: none; }
    .faq-item.open .faq-a { display: block; }
  </style>
</head>
<body>
<div id="shell">

  <!-- ── LOGIN ─────────────────────────────── -->
  <div class="screen active" id="screen-login" style="display:flex">
    <div class="login-bg">
      <div class="login-logo">deli<em>vr</em></div>
      <div class="login-tagline">Local food. Fast delivery.</div>
    </div>
    <div class="login-card">
      <div style="font-family:var(--font-h);font-size:16px;font-weight:700;margin-bottom:16px">Sign in as</div>
      <div class="role-picker">
        <div class="role-btn active" id="role-user" onclick="setRole('user')">
          <span class="rb-icon">🧑</span>
          <div class="rb-label">Customer</div>
          <div class="rb-sub">Order food</div>
        </div>
        <div class="role-btn" id="role-admin" onclick="setRole('admin')">
          <span class="rb-icon">⚙️</span>
          <div class="rb-label">Admin</div>
          <div class="rb-sub">Manage store</div>
        </div>
      </div>
      <div class="auth-toggle">
        <div class="auth-toggle-btn active" id="at-login" onclick="setAuthMode('login')">Sign In</div>
        <div class="auth-toggle-btn" id="at-signup" onclick="setAuthMode('signup')">Sign Up</div>
      </div>
      <div id="login-fields"></div>
      <button class="btn btn-primary" onclick="doLogin()" id="login-btn">Sign In</button>
      <div class="hint">Demo: tap Sign In — no password needed.<br><span onclick="setRole('admin');doLogin()">Or go straight to Admin →</span></div>
    </div>
  </div>

  <!-- ── USER APP ───────────────────────────── -->
  <div class="screen" id="screen-user">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-logo">deli<em>vr</em></div>
      <div class="topbar-right">
        <div class="icon-btn" onclick="nav('cart')">
          🛒<span class="badge" id="cart-badge" style="display:none">0</span>
        </div>
      </div>
    </div>
    <!-- Pages -->
    <div class="scroller" id="user-scroller">
      <div id="page-home" style="padding-bottom:24px"></div>
      <div id="page-menu" style="padding-bottom:24px;display:none"></div>
      <div id="page-cart" style="display:none"></div>
      <div id="page-tracker" style="display:none"></div>
      <div id="page-account" style="display:none"></div>
    </div>
    <!-- Tab bar -->
    <div class="tabbar">
      <button class="tab active" onclick="nav('home')" id="t-home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
      </button>
      <button class="tab" onclick="nav('menu')" id="t-menu">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Menu
      </button>
      <button class="tab" onclick="nav('tracker')" id="t-tracker">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Track
      </button>
      <button class="tab" onclick="nav('account')" id="t-account">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Account
      </button>
    </div>
  </div>

  <!-- ── ADMIN APP ──────────────────────────── -->
  <div class="screen" id="screen-admin">
    <div class="topbar">
      <div class="topbar-logo">deli<em>vr</em> <span style="font-size:12px;color:var(--muted);font-family:var(--font-b);font-weight:400">Admin</span></div>
      <div class="topbar-right">
        <span class="pill p-green" style="font-size:9px">● LIVE</span>
        <div class="icon-btn" onclick="doLogout()" title="Sign out">🚪</div>
      </div>
    </div>
    <div class="admin-tabs-bar">
      <div class="adm-tab active" onclick="switchAdminTab('orders',this)">Orders</div>
      <div class="adm-tab" onclick="switchAdminTab('menu',this)">Menu</div>
      <div class="adm-tab" onclick="switchAdminTab('staff',this)">Staff</div>
      <div class="adm-tab" onclick="switchAdminTab('settings',this)">Settings</div>
    </div>
    <div class="scroller"><div class="adm-content" id="adm-content"></div></div>
  </div>

  <!-- ── SHEET OVERLAY ─────────────────────── -->
  <div class="sheet-overlay" id="overlay" onclick="closeSheet()">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-scroll" id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
