name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Add Android platform (if not committed)
        run: '[ -d android ] || npx cap add android'

      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: delivr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk delivr-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest delivr-debug.apk --target "$GITHUB_SHA" --prerelease --title "Delivr debug APK (latest)" --notes "Debug APK built from $GITHUB_SHA"
